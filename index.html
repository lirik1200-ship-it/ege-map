function parseDate(raw){
  if(raw instanceof Date) return raw;
  const s=String(raw||"").trim();
  let m=s.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/^(\d{1,2})[-./](\d{1,2})[-./](\d{4})/);
  if(m) return new Date(+m[3],+m[2]-1,+m[1]);
  const d=new Date(s);
  return isNaN(d.getTime())?null:d;
}
function isoDate(d){
  if(!d) return "";
  const mm=String(d.getMonth()+1).padStart(2,"0"), dd=String(d.getDate()).padStart(2,"0");
  return `${d.getFullYear()}-${mm}-${dd}`;
}
function formatDate(d,withYear){
  if(!d) return "—";
  const dd=String(d.getDate()).padStart(2,"0"), mm=String(d.getMonth()+1).padStart(2,"0");
  return withYear?`${dd}.${mm}.${d.getFullYear()}`:`${dd}.${mm}`;
}
function toNumber(v){
  if(typeof v==="number") return isFinite(v)?v:null;
  if(v==null) return null;
  const s=String(v).trim().replace(",",".");
  if(s===""||s==="-"||s==="—") return null;
  const n=parseFloat(s);
  return isNaN(n)?null:n;
}
function plural(n,one,few,many){
  const a=n%10,b=n%100;
  if(a===1&&b!==11) return one;
  if(a>=2&&a<=4&&(b<10||b>=20)) return few;
  return many;
}
function median(arr){
  if(!arr.length) return 0;
  const s=[...arr].sort((a,b)=>a-b), m=Math.floor(s.length/2);
  return s.length%2 ? s[m] : Math.round((s[m-1]+s[m])/2);
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta=document.createElement("textarea");
    ta.value=text; document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand("copy"); }catch(_){}
    document.body.removeChild(ta); return ok;
  }
}
function daysUntilExam(){

  if(!exam) return null;
  const today=new Date(); today.setHours(0,0,0,0);

  return Math.round((exam-today)/86400000);
}

function buildExam(raw){
  const date=parseDate(raw.date||raw.exam_date);
  const essay={};
  CRITERIA_KEYS.forEach(k=>{
    const v=toNumber(raw.essay?raw.essay[k]:undefined);
    if(v!==null) essay[k]=Math.max(0,Math.min(ESSAY_CRITERIA[k].max,v));
  });
  const scores={};
  Object.entries(raw.results||{}).forEach(([k,v])=>{
    const match=String(k).match(/\d+/);
    if(!match) return;
    const n=parseInt(match[0],10);
    if(!(n>=1&&n<=27)) return;
    const val=toNumber(v);
    if(val===null) return;
    scores[n]=Math.max(0,Math.min(maxScoreFor(n),val));
  });
  const hasEssay=Object.keys(essay).length>0;
  if(hasEssay && scores[27]===undefined) scores[27]=CRITERIA_KEYS.reduce((s,k)=>s+(essay[k]||0),0);
  if(!Object.keys(scores).length) return null;

  const primary=Object.values(scores).reduce((a,b)=>a+b,0);
  return {
    date, key: date?isoDate(date):String(raw.date||"nodate"),
    label: date?formatDate(date):"Пробник",
    fullLabel: date?formatDate(date,true):"Пробник",
    scores, essay, hasEssay,
    primary: Math.round(primary), secondary: toSecondary(primary)
  };
}

function summarize(student){
  const e=student.exams;
  const last=e[e.length-1], prev=e.length>1?e[e.length-2]:null;
  return {last,prev,
    best:e.reduce((a,x)=>x.secondary>a.secondary?x:a,e[0]),
    avgSecondary:Math.round(e.reduce((s,x)=>s+x.secondary,0)/e.length),
    deltaPrimary:prev?last.primary-prev.primary:null,
    deltaSecondary:prev?last.secondary-prev.secondary:null};

function weaknessReport(student,taskNumbers){
  return taskNumbers.map(task=>{
    let possible=0,scored=0,attempts=0;
    student.exams.forEach(ex=>{
      const v=ex.scores[task];
      if(v===undefined) return;
      possible+=maxScoreFor(task); scored+=v; attempts++;
    });
    return {task,possible,scored,attempts,lost:possible-scored,rate:possible?scored/possible:0};
  }).filter(r=>r.attempts>0);
}
const topWeakTasks=(report,count)=>report.filter(r=>r.lost>0)
  .sort((a,b)=>(b.lost-a.lost)||(a.rate-b.rate)||(a.task-b.task)).slice(0,count);

function classRateForTask(task,group){
  let possible=0,scored=0,students=0;
  const list = group===undefined ? state.students : studentsOfGroup(group);
  list.forEach(st=>{
    let seen=false;
    st.exams.forEach(ex=>{
      const v=ex.scores[task];
      if(v===undefined) return;
      seen=true; possible+=maxScoreFor(task); scored+=v;
    });
    if(seen) students++;
  });
  return possible?{rate:scored/possible,students}:null;
}
function essayReport(student){
  const exams=student.exams.filter(e=>e.hasEssay);
  if(!exams.length) return null;
  const rows=CRITERIA_KEYS.map(key=>{
    const meta=ESSAY_CRITERIA[key];
    const values=exams.map(ex=>ex.essay[key]);
    const seen=values.filter(v=>v!==undefined);
    const possible=seen.length*meta.max, scored=seen.reduce((a,b)=>a+b,0);
    return {key,meta,values,possible,scored,attempts:seen.length,lost:possible-scored,rate:possible?scored/possible:0};
  }).filter(r=>r.attempts>0);
  const totals=exams.map(ex=>CRITERIA_KEYS.reduce((s,k)=>s+(ex.essay[k]||0),0));
  const lastExam=exams[exams.length-1];
  const blocks=ESSAY_BLOCKS.map(b=>({
    block:b, max:blockMax(b),
    last:CRITERIA_KEYS.filter(k=>ESSAY_CRITERIA[k].block===b).reduce((s,k)=>s+(lastExam.essay[k]||0),0)
  }));
  return {exams,rows,totals,blocks,
    last:totals[totals.length-1],
    avg:Math.round(totals.reduce((a,b)=>a+b,0)/totals.length*10)/10,
    delta:totals.length>1?totals[totals.length-1]-totals[totals.length-2]:null,
    count:exams.length};
}
function forecast(student,report){
  const e=student.exams, n=e.length, last=e[n-1];
  const ys=e.map(x=>x.primary);
  const mean=ys.reduce((a,b)=>a+b,0)/n;
  const spread=Math.sqrt(ys.reduce((s,y)=>s+(y-mean)**2,0)/Math.max(1,n-1))||0;
  const solid=report.filter(r=>r.attempts>=FORECAST.minAttempts&&r.lost>0);
  const top3=topWeakTasks(solid,3);
  const recoverable=top3.reduce((s,r)=>s+(r.lost/r.attempts)*FORECAST.recoveryRate,0);
  const lowestTask=[...report].sort((a,b)=>a.rate-b.rate||a.task-b.task)[0]||null;
  const base={top3,lowestTask,recoverable:Math.round(recoverable*10)/10,stepsLeft:0,r2:0,reliable:false,sigma:Math.max(FORECAST.minSigma,spread)};

  if(n<3){
    const lowP=Math.max(0,last.primary-base.sigma), highP=Math.min(MAX_PRIMARY,last.primary+base.sigma);
    return {...base,note:"Пробников меньше трёх, поэтому тренд не строим и показываем коридор по разбросу результатов.",
      basePrimary:last.primary,baseSecondary:last.secondary,
      lowSecondary:toSecondary(lowP),highSecondary:toSecondary(highP),
      potentialPrimary:Math.min(MAX_PRIMARY,last.primary+recoverable),
      potentialSecondary:toSecondary(Math.min(MAX_PRIMARY,last.primary+recoverable))};
  }

  const xs=e.map((_,i)=>i);
  const w=xs.map(i=>Math.pow(FORECAST.recencyWeight,n-1-i));
  const sw=w.reduce((a,b)=>a+b,0);
  const mx=xs.reduce((s,x,i)=>s+x*w[i],0)/sw, my=ys.reduce((s,y,i)=>s+y*w[i],0)/sw;
  let num=0,den=0;
  xs.forEach((x,i)=>{num+=w[i]*(x-mx)*(ys[i]-my);den+=w[i]*(x-mx)**2;});
  const slope=den?num/den:0, intercept=my-slope*mx;
  const fit=xs.map(x=>slope*x+intercept);
  const ssRes=ys.reduce((s,y,i)=>s+(y-fit[i])**2,0);
  const ssTot=ys.reduce((s,y)=>s+(y-mean)**2,0);
  const r2=ssTot?Math.max(0,1-ssRes/ssTot):0;
  const sigma=Math.max(FORECAST.minSigma,Math.sqrt(ssRes/Math.max(1,n-2)));

  let stepsLeft=2;
  const examDate=parseDate(EXAM_DATE);
  if(examDate&&last.date&&e[0].date){
    const interval=((last.date-e[0].date)/86400000)/(n-1)||30;
    stepsLeft=Math.max(0,Math.min(8,Math.round((examDate-last.date)/86400000/interval)));
  }
  const anchor=FORECAST.anchorMix*last.primary+(1-FORECAST.anchorMix)*fit[n-1];

  if(r2<FORECAST.minR2){
    return {...base,r2,sigma,stepsLeft,note:"Результаты нестабильны и устойчивого тренда нет, поэтому показан коридор по разбросу.",
      basePrimary:Math.round(anchor),baseSecondary:toSecondary(anchor),
      lowSecondary:toSecondary(Math.max(0,anchor-sigma)),
      highSecondary:toSecondary(Math.min(MAX_PRIMARY,anchor+sigma)),
      potentialPrimary:Math.round(Math.min(MAX_PRIMARY,anchor+recoverable)),
      potentialSecondary:toSecondary(Math.min(MAX_PRIMARY,anchor+recoverable))};
  }

  const slopeEff=slope*Math.min(1,r2);
  let p=anchor;
  for(let k=1;k<=stepsLeft;k++){
    const headroom=Math.min(1,Math.max(0,(MAX_PRIMARY-p)/FORECAST.headroom));
    p+=slopeEff*Math.pow(FORECAST.stepDecay,k)*headroom;
  }
  p=Math.max(0,Math.min(MAX_PRIMARY,p));
  return {...base,r2,sigma,stepsLeft,reliable:true,slopePerExam:slope,
    basePrimary:Math.round(p),baseSecondary:toSecondary(p),
    lowSecondary:toSecondary(Math.max(0,p-sigma)),
    highSecondary:toSecondary(Math.min(MAX_PRIMARY,p+sigma)),
    potentialPrimary:Math.round(Math.min(MAX_PRIMARY,p+recoverable)),
    potentialSecondary:toSecondary(Math.min(MAX_PRIMARY,p+recoverable)),note:null};
}
const snapshotExam=(st,key)=> key==="last" ? st.exams[st.exams.length-1] : (st.exams.find(e=>e.key===key)||null);

function groupReport(students,taskNumbers,examKey){
  const entries=students.map(st=>({student:st,exam:snapshotExam(st,examKey)})).filter(x=>x.exam);
  const secondaries=entries.map(x=>x.exam.secondary);
  const rows=taskNumbers.map(task=>{
    let possible=0,scored=0;
    const fails=[],partial=[],byStudent={};
    entries.forEach(({student,exam})=>{
      const v=exam.scores[task];
      byStudent[student.id]=v;
      if(v===undefined) return;
      const m=maxScoreFor(task);
      possible+=m; scored+=v;
      if(v<=0) fails.push(student.code); else if(v<m) partial.push(student.code);
    });
    return {task,possible,scored,byStudent,fails,partial,rate:possible?scored/possible:null,lost:possible-scored};
  }).filter(r=>r.rate!==null);

  const essayRows=CRITERIA_KEYS.map(key=>{
    const meta=ESSAY_CRITERIA[key];
    let possible=0,scored=0;
    entries.forEach(({exam})=>{
      if(!exam.hasEssay||exam.essay[key]===undefined) return;
      possible+=meta.max; scored+=exam.essay[key];
    });
    return {key,meta,possible,scored,rate:possible?scored/possible:null};
  }).filter(r=>r.rate!==null);

  const dynamics=allExamKeys(students).map(({key,label,fullLabel})=>{
    const vals=students.map(st=>st.exams.find(e=>e.key===key)).filter(Boolean).map(e=>e.secondary);
    return vals.length?{label,fullLabel,avg:Math.round(vals.reduce((a,b)=>a+b,0)/vals.length),
      min:Math.min(...vals),max:Math.max(...vals),count:vals.length}:null;
  }).filter(Boolean);

  const movers=students.filter(st=>st.exams.length>1).map(st=>({
    code:st.code,id:st.id,
    delta:st.exams[st.exams.length-1].secondary-st.exams[0].secondary,
    last:st.exams[st.exams.length-1].secondary
  })).sort((a,b)=>b.delta-a.delta);

  const buckets=[
    {label:"ниже 36",test:v=>v<36},{label:"36–60",test:v=>v>=36&&v<=60},
    {label:"61–80",test:v=>v>60&&v<=80},{label:"81–100",test:v=>v>80}
  ].map(b=>({...b,count:secondaries.filter(b.test).length}));

  return {entries,rows,essayRows,dynamics,movers,buckets,
    avgSecondary:secondaries.length?Math.round(secondaries.reduce((a,b)=>a+b,0)/secondaries.length):0,
    median:median(secondaries),
    min:secondaries.length?Math.min(...secondaries):0,
    max:secondaries.length?Math.max(...secondaries):0,
    belowPass:secondaries.filter(v=>v<PASS_SCORE_UNIVERSITY).length,
    weakest:[...rows].sort((a,b)=>a.rate-b.rate).slice(0,5)};
}

function countdownStyle(days){
  if(days===null) return null;
  if(days<0) return {text:"Экзамен прошёл", cls:"bg-gray-50 text-ink-500 border-gray-200"};
  if(days===0) return {text:"Экзамен сегодня", cls:"bg-rose-50 text-rose-700 border-rose-200"};
  const word=plural(days,"день","дня","дней");
  if(days<30) return {text:`До экзамена ${days} ${word}`, cls:"bg-rose-50 text-rose-700 border-rose-200"};
  if(days<100) return {text:`До экзамена ${days} ${word}`, cls:"bg-amber-50 text-amber-700 border-amber-200"};
  return {text:`До экзамена ${days} ${word}`, cls:"bg-emerald-50 text-emerald-700 border-emerald-200"};
}

function renderCountdown(){
  const days=daysUntilExam();
  const st=countdownStyle(days);
  const side=$("#countdown-side"), mob=$("#countdown-mobile");
  const hidden = ["screen-loading","screen-auth"].includes(state.screen);
  if(!st || hidden){
    side.classList.add("hidden");
    mob.innerHTML="";
    return;
  }
  const dateLabel=formatDate(parseDate(EXAM.date),true);
  const tip=`${EXAM.preliminary?"Предварительная дата":"Дата"} экзамена — ${dateLabel}. ${EXAM.preliminary?EXAM.note:""}`;

  side.className=`hidden md:flex fixed right-0 top-1/2 -translate-y-1/2 z-20 items-center gap-2 px-2.5 py-4 rounded-l-xl border border-r-0 text-xs font-semibold shadow-soft transition ${st.cls}`;
  side.innerHTML=`<span>${escHtml(st.text)}</span>${EXAM.preliminary?`<span class="opacity-70 font-normal">дата предварительная</span>`:""}`;
  side.onclick=()=>{ if(state.mode==="guest"||state.mode==="auth") route("screen-landing"); };

  mob.innerHTML=`<span class="inline-flex items-center px-2.5 py-1.5 rounded-lg border text-[11px] font-semibold ${st.cls}">${escHtml(st.text)}</span>`;

  // Подсказка через глобальный тултип: системная всплывашка на повёрнутом
  // элементе показывалась ненадёжно
  const tipTitle = `Экзамен ${dateLabel}${EXAM.preliminary?" · дата предварительная":""}`;
  const tipRule = EXAM.preliminary ? EXAM.note : "Дата взята из официального расписания.";
  [side, mob.firstElementChild].forEach(el=>{
    if(!el) return;
    el.dataset.label="До экзамена";
    el.dataset.title=tipTitle;
    el.dataset.rule=tipRule;
    if(el.dataset.tipBound) return;
    el.dataset.tipBound="1";
    el.addEventListener("mouseenter",showTooltip);
    el.addEventListener("mouseleave",hideTooltip);
    el.addEventListener("focus",showTooltip);
    el.addEventListener("blur",hideTooltip);
  });
}

function renderChrome(){
  const cfg=modeConfig();
  const [color,label]=cfg.badge;
  const planLabel = state.mode==="teacher" ? `${label} · ${state.plan.name}` : label;
  $("#source-badge").innerHTML=`<span class="w-2 h-2 rounded-full ${color}"></span><span>${escHtml(planLabel)}</span>`;
  $("#signout-btn").classList.toggle("hidden",state.mode!=="teacher");

  const showNav = cfg.nav && NAV_SCREENS.includes(state.screen);
  const items=[["screen-list","Ученики"],["screen-group","Класс"],["screen-entry","Ввести пробник"],["screen-pricing","Тарифы"]];
  const html = showNav ? items.map(([id,l])=>{
    const active=state.view===id;
    return `<button data-nav="${id}" class="px-3 py-1.5 rounded-lg font-medium transition whitespace-nowrap ${active?"bg-brand-50 text-brand-600":"text-ink-500 hover:text-ink-900"}">${l}</button>`;
  }).join("") : "";
  ["#main-nav","#mobile-nav"].forEach(sel=>{
    const el=$(sel); if(!el) return;
    el.innerHTML=html;
    el.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>route(b.dataset.nav));
  });
  renderCountdown();
}
function route(id){
  destroyCharts();
  if(id==="screen-list") renderStudentList();
  if(id==="screen-group") renderGroup();
  if(id==="screen-entry") renderEntry();
  if(id==="screen-import") renderImport();
  if(id==="screen-pricing") renderPricing();
  if(id==="screen-landing") renderLanding();
  if(id==="screen-auth") renderAuth();
  if(id==="screen-legal") renderLegal();
  showScreen(id);
  window.scrollTo({top:0});
}
function openLegal(tab){
  state.legalTab=tab||"offer";
  renderLegal();
  showScreen("screen-legal");
  window.scrollTo({top:0});
}
document.querySelectorAll(".legal-link").forEach(b=>b.onclick=()=>openLegal(b.dataset.legal));

function fail(message){ setMode("error"); $("#error-detail").textContent=message; showScreen("screen-error"); }
async function reloadData(){
  if(state.mode!=="teacher") return;
  state.students=await api.load();
  state.taskNumbers=collectTaskNumbers(state.students);
}

$("#logo-btn").onclick=()=>{
  if(state.mode==="teacher") route("screen-list");
  else if(state.mode==="share") return;
  else route("screen-landing");
};

async function boot(){
  setMode("boot");
  showScreen("screen-loading");
  const params=new URLSearchParams(location.search);
  const token=params.get("s");
  try{
    if(!hasBackend() || !db){
      setMode("demo");
      state.students=DEMO_STUDENTS.map((s,i)=>({id:"demo"+i,code:s.code,group:s.group||"",shareToken:null,
        exams:s.exams.map(buildExam).filter(Boolean)}));
      state.taskNumbers=collectTaskNumbers(state.students);
      renderStudentList(); showScreen("screen-list");
      return;
    }
    if(token){
      const student=await api.loadShared(token);
      if(!student.exams.length) throw new Error("По этой ссылке пока нет ни одного пробника.");
      setMode("share");
      state.students=[student];
      state.taskNumbers=collectTaskNumbers(state.students);
      destroyCharts();
      renderDashboard(student,true);
      showScreen("screen-student");
      return;
    }
    const {data:{session},error}=await db.auth.getSession();
    if(error) throw new Error("Не удалось проверить сессию: "+error.message);
    if(!session){
      setMode("guest");
      renderLanding();
      if(params.get("page")==="pricing"){ renderPricing(); showScreen("screen-pricing"); }
      else showScreen("screen-landing");
      return;
    }
    setMode("teacher");
    state.email=session.user.email||"";
    state.plan=await api.loadPlan();
    await reloadData();
    renderChrome(); renderStudentList(); showScreen("screen-list");
  }catch(err){ fail(err && err.message ? err.message : String(err)); }
}

            <button type="button" data-open-legal="privacy" class="font-semibold text-brand-600 hover:text-brand-700 underline">политикой</button>,
            включая трансграничную передачу, и подтверждаю, что не буду вносить в сервис персональные данные обучающихся
          </span>
        </label>
      </div>

      <button id="auth-submit" class="w-full px-4 py-2.5 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-sm font-semibold transition disabled:opacity-40 disabled:cursor-not-allowed" ${preChecked?"":"disabled"}>Войти</button>

      </div>
      <button id="auth-back" class="mt-4 text-xs font-semibold text-ink-500 hover:text-ink-900 transition">← К описанию</button>
    </div>`;

  const boxes=[...$("#screen-auth").querySelectorAll(".consent-box")];
  const btn=$("#auth-submit");
  const syncBtn=()=>{ btn.disabled=!boxes.every(b=>b.checked); };
  boxes.forEach(b=>b.onchange=syncBtn);

  $("#screen-auth").querySelectorAll("[data-open-legal]").forEach(b=>{
    b.onclick=()=>openLegal(b.dataset.openLegal);
  });

  const submit=async()=>{
    if(btn.disabled) return;
    const email=$("#auth-email").value.trim(), password=$("#auth-password").value;
    const msg=$("#auth-msg");
    if(!email||!password){ msg.textContent="Введите почту и пароль"; return; }
    if(!boxes.every(b=>b.checked)){ msg.textContent="Отметьте согласие с офертой и политикой"; return; }
    btn.textContent="Проверяем…";
    const {error}=await db.auth.signInWithPassword({email,password});
    btn.textContent="Войти";
    if(error){ msg.textContent="Не удалось войти: "+error.message; return; }
    consentStore.save(email);
    msg.textContent=""; boot();
  };
  btn.onclick=submit;
  $("#auth-password").onkeydown=e=>{if(e.key==="Enter")submit();};
  $("#auth-email").onkeydown=e=>{if(e.key==="Enter")$("#auth-password").focus();};
  $("#auth-back").onclick=()=>{ setMode("guest"); route("screen-landing"); };

function trendMarkup(delta,unit){
  if(delta===null||delta===undefined) return `<span class="text-xs text-ink-300">первый пробник</span>`;
  if(delta===0) return `<span class="text-xs text-ink-500 tnum">без изменений</span>`;
  const up=delta>0;
  return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-lg text-xs font-semibold tnum ${up?"text-emerald-600 bg-emerald-50":"text-rose-600 bg-rose-50"}">${up?"↑":"↓"} ${Math.abs(delta)}${unit||""}</span>`;
}
function cellStyle(value,max){
  if(value===undefined||value===null) return {cls:"bg-gray-50 text-ink-300",text:"·",label:"нет данных"};
  if(value>=max) return {cls:"bg-emerald-100 text-emerald-700",text:String(value),label:`${value} из ${max}`};
  if(value<=0) return {cls:"bg-rose-100 text-rose-700",text:"0",label:`0 из ${max}`};
  return {cls:"bg-amber-100 text-amber-700",text:String(value),label:`${value} из ${max}`};
}
const barColor=pc=>pc<40?"bg-rose-500":pc<70?"bg-amber-500":"bg-emerald-500";
const shareLink=token=>`${location.origin}${location.pathname}?s=${token}`;

function authorCardMarkup(){
  return `
  <div class="mt-6 bg-white rounded-2xl shadow-soft p-5 sm:p-6 flex flex-wrap items-center gap-4">
    ${avatarMarkup("w-11 h-11","text-sm")}
    <div class="flex-1 min-w-[200px]">
      <div class="font-display font-bold">${escHtml(AUTHOR.name)}</div>
      <div class="text-xs text-ink-500">${escHtml(AUTHOR.brand)} · ${escHtml(AUTHOR.tagline)} Разборы, материалы и расписание занятий — в моих каналах.</div>
    </div>
    <div class="flex gap-2">
      <a href="${escAttr(AUTHOR.telegram)}" target="_blank" rel="noopener"
        class="px-4 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-sm font-semibold transition">Telegram</a>
      <a href="${escAttr(AUTHOR.vk)}" target="_blank" rel="noopener"
        class="px-4 py-2 rounded-xl bg-white border border-gray-200 hover:border-brand-500 text-sm font-semibold transition">ВКонтакте</a>
    </div>
  </div>`;
}

function downloadFile(filename,content,mime){
  const blob=new Blob([content],{type:mime+";charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
const safeName=s=>String(s).replace(/[\\/:*?"<>|]+/g,"_").replace(/\s+/g,"_");

    setTimeout(()=>{msg.textContent="";},2500);

  if(canEdit && !atLimit) $("#add-students").onclick=openAddStudents;

        class="w-full text-sm font-mono bg-paper rounded-xl p-4 border border-gray-200 focus:border-brand-500 outline-none transition resize-none"></textarea>
      <div class="flex gap-2 mt-4">
        <button id="codes-save" class="px-4 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-sm font-semibold transition">Добавить</button>
        <button id="codes-close" class="ml-auto px-4 py-2 rounded-xl text-ink-500 hover:text-ink-900 text-sm font-semibold transition">Закрыть</button>
      </div>
      <p id="codes-msg" class="text-xs mt-3"></p>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelector("#codes-close").onclick=()=>modal.remove();
  modal.onclick=e=>{if(e.target===modal)modal.remove();};

  modal.querySelector("#gen-btn").onclick=()=>{
    const prefix=modal.querySelector("#gen-prefix").value.trim()||"У-";
    const count=Math.max(1,Math.min(free,parseInt(modal.querySelector("#gen-count").value,10)||1));
    const existing=new Set(state.students.map(s=>s.code.toLowerCase()));
    const out=[]; let i=1;
    while(out.length<count && i<200){
      const code=prefix+String(i).padStart(2,"0");
      if(!existing.has(code.toLowerCase()) && !validateCode(code)) out.push(code);
      i++;
    }
    modal.querySelector("#codes-input").value=out.join("\n");
  };

  modal.querySelector("#codes-save").onclick=async e=>{
    const btn=e.currentTarget, msg=modal.querySelector("#codes-msg");
    const group=modal.querySelector("#add-group").value.trim();
    const groupErr=validateGroup(group);
    if(groupErr){ msg.className="text-xs mt-3 text-rose-600"; msg.textContent=groupErr; return; }

    const existing=new Set(state.students.map(s=>s.code.toLowerCase()));
    const raw=[...new Set(modal.querySelector("#codes-input").value.split("\n").map(s=>s.trim()).filter(Boolean))];

    for(const code of raw){
      const err=validateCode(code);
      if(err){ msg.className="text-xs mt-3 text-rose-600"; msg.textContent=`«${code}» — ${err}`; return; }
    }
    const codes=raw.filter(c=>!existing.has(c.toLowerCase()));
    if(!codes.length){ msg.className="text-xs mt-3 text-rose-600"; msg.textContent="Новых кодов в списке нет"; return; }
    if(codes.length>free){ msg.className="text-xs mt-3 text-rose-600"; msg.textContent=`На тарифе свободно только ${free} ${plural(free,"место","места","мест")}`; return; }

    btn.textContent="Сохраняем…";
    try{
      await api.addStudents(codes.map(code=>({code,group})));
      await reloadData();
      if(group) state.currentGroup=group;
      renderStudentList();
      msg.className="text-xs mt-3 text-emerald-600";
      msg.textContent=`Добавлено: ${codes.length}${group?` в класс «${group}»`:""}`;
      modal.querySelector("#codes-input").value="";
    }catch(err){
      msg.className="text-xs mt-3 text-rose-600";
      msg.textContent=/limit|лимит/i.test(err.message)?"Достигнут лимит тарифа, освободите место или смените тариф":err.message;
    }
    btn.textContent="Добавить";
  };
}

        callbacks:{title:i=>g.dynamics[i[0].dataIndex].fullLabel,

            return i.datasetIndex===1?`средний ${d.avg} · писали ${d.count}`:`${i.dataset.label.toLowerCase()} ${i.parsed.y}`;}}}},
      scales:{y:{min:0,max:100,ticks:{stepSize:20,color:"#6B7280",font:{family:"JetBrains Mono",size:11}},grid:{color:"#F1F2F5",drawBorder:false}},
        x:{ticks:{color:"#6B7280",font:{size:11}},grid:{display:false,drawBorder:false}}}}

  makeChart("group-distribution",{
    type:"bar",
    data:{labels:g.buckets.map(b=>b.label),datasets:[{data:g.buckets.map(b=>b.count),
      backgroundColor:["#E24B4A","#EF9F27","#5B57D6","#1D9E75"],borderRadius:8,barThickness:38}]},
    options:{responsive:true,maintainAspectRatio:false,

        callbacks:{label:i=>`${i.parsed.y} ${plural(i.parsed.y,"ученик","ученика","учеников")}`}}},
      scales:{y:{beginAtZero:true,ticks:{stepSize:1,precision:0,color:"#6B7280",font:{family:"JetBrains Mono",size:11}},grid:{color:"#F1F2F5",drawBorder:false}},

function groupReportText(g,examLabel,groupName){
  const lines=[
    `Отчёт по классу «${groupName}» — ЕГЭ по русскому языку`,
    `Выборка: ${examLabel}. Работ в выборке: ${g.entries.length}.`,``,
    `Средний тестовый балл ${g.avgSecondary}, медиана ${g.median}, разброс от ${g.min} до ${g.max}.`,
    `Ниже порога 36 баллов — ${g.belowPass} ${plural(g.belowPass,"ученик","ученика","учеников")}.`,``,
    `Темы для общего разбора:`
  ];
  g.weakest.forEach((r,i)=>{
    const t=EGE_TOPICS[r.task]||{title:"Задание "+r.task,review:""};
    lines.push(`${i+1}. Задание ${r.task} — ${t.title}. Успешность ${Math.round(r.rate*100)}%. ${t.review}`);
  });
  if(g.essayRows.length){
    const worst=[...g.essayRows].sort((a,b)=>a.rate-b.rate)[0];
    lines.push(``,`Сочинение по классу. Слабее всего критерий ${worst.key} — ${worst.meta.title}, ${Math.round(worst.rate*100)}% от возможного.`);
  }
  lines.push(``,`———`,`${AUTHOR.name} · ${AUTHOR.brand}`,`Telegram: ${AUTHOR.telegram}`,`ВКонтакте: ${AUTHOR.vk}`);
  return lines.join("\n");
}

function openGroupReport(g,examLabel,groupName){
  const images={
    dynamics: state.charts["group-dynamics"]?state.charts["group-dynamics"].toBase64Image():null,
    distribution: state.charts["group-distribution"]?state.charts["group-distribution"].toBase64Image():null
  };
  const text=groupReportText(g,examLabel,groupName);
  const stamp=isoDate(new Date());

  const modal=document.createElement("div");
  modal.className="fixed inset-0 z-[9998] bg-ink-900/40 backdrop-blur-sm flex items-center justify-center p-5";
  modal.innerHTML=`
    <div class="bg-white rounded-2xl shadow-lift max-w-lg w-full p-6">
      <div class="flex items-center gap-3 mb-4">
        ${avatarMarkup("w-9 h-9","text-[13px]")}
        <div>
          <h2 class="font-display font-extrabold text-lg leading-tight">Отчёт по классу готов</h2>
          <p class="text-xs text-ink-500">Класс «${escHtml(groupName)}» · выборка — ${escHtml(examLabel)}</p>
        </div>
      </div>
      <textarea id="gr-text" readonly class="w-full h-52 text-[13px] leading-relaxed bg-paper rounded-xl p-4 border border-gray-200 resize-none">${escHtml(text)}</textarea>
      <div class="flex flex-wrap gap-2 mt-4">
        <button id="gr-html" class="px-4 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-sm font-semibold transition">Скачать отчёт</button>
        <button id="gr-txt" class="px-4 py-2 rounded-xl bg-white border border-gray-200 hover:border-brand-500 text-sm font-semibold transition">Скачать текстом</button>
        <button id="gr-copy" class="px-4 py-2 rounded-xl bg-white border border-gray-200 hover:border-brand-500 text-sm font-semibold transition">Скопировать</button>
        <button id="gr-close" class="ml-auto px-4 py-2 rounded-xl text-ink-500 hover:text-ink-900 text-sm font-semibold transition">Закрыть</button>
      </div>
      <p class="text-[11px] text-ink-500 mt-3">В файл входят оба графика, таблица по кодам, проценты по всем заданиям и критерии сочинения.</p>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelector("#gr-close").onclick=()=>modal.remove();
  modal.onclick=e=>{if(e.target===modal)modal.remove();};
  modal.querySelector("#gr-html").onclick=e=>{
    downloadFile(`${safeName(AUTHOR.brand)}_${safeName(groupName)}_${stamp}.html`,groupReportDocument(g,examLabel,images,groupName),"text/html");
    e.currentTarget.textContent="Файл скачан";
    setTimeout(()=>{e.currentTarget.textContent="Скачать отчёт";},1600);
  };
  modal.querySelector("#gr-txt").onclick=()=>downloadFile(`${safeName(AUTHOR.brand)}_${safeName(groupName)}_${stamp}.txt`,text,"text/plain");
  modal.querySelector("#gr-copy").onclick=async e=>{
    const ok=await copyText(text);
    e.currentTarget.textContent=ok?"Скопировано":"Не вышло";
    setTimeout(()=>{e.currentTarget.textContent="Скопировать";},1600);
  };
}

function openStudent(id){
  const student=state.students.find(s=>s.id===id);
  if(!student) return;
  destroyCharts();
  state.currentStudent=student;
  renderDashboard(student,false);
  showScreen("screen-student");
  window.scrollTo({top:0});
}

function renderDashboard(student,readOnly){
  const s=summarize(student);
  const report=weaknessReport(student,state.taskNumbers);
  const weakest=topWeakTasks(report,3);
  const essay=essayReport(student);
  const fc=forecast(student,report);
  const canEdit=modeConfig().canEdit;
  const note=readOnly?null:codebook.read()[student.code];
  const group=groupTitle(student.group);

  $("#screen-student").innerHTML=`
    ${readOnly?"":`<button id="back-btn" class="inline-flex items-center gap-2 text-sm text-ink-500 hover:text-brand-600 mb-5 transition"><span class="text-base leading-none">←</span> Все ученики</button>`}

    <div class="flex flex-wrap items-end justify-between gap-4 mb-6">
      <div>
        <h1 class="font-display font-extrabold text-2xl tracking-tight font-mono">${escHtml(student.code)}</h1>
        <p class="text-sm text-ink-500 mt-1">${readOnly?"Твоя страница результатов · "+escHtml(AUTHOR.brand):(note?escHtml(note)+" · ":"")+escHtml(group)+" · разбор по заданиям спецификации ФИПИ"}</p>
      </div>
      <div class="flex gap-2">
        <button id="report-btn" class="px-4 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-sm font-semibold transition">${readOnly?"Скачать отчёт":"Отчёт для родителей"}</button>
        ${(!readOnly&&canEdit)?`<button id="entry-for-btn" class="px-4 py-2 rounded-xl bg-white border border-gray-200 hover:border-brand-500 text-sm font-semibold transition">Внести пробник</button>`:""}
      </div>
    </div>

    ${summaryCardsMarkup(s,student.exams.length)}
    ${forecastMarkup(fc)}
    ${scoreChartMarkup(fc)}

    <div class="mb-6">
      <div class="flex flex-wrap items-baseline justify-between gap-2 mb-4">
        <h2 class="font-display font-bold text-lg">Зоны развития</h2>
        <span class="text-xs text-ink-500">три задания, где потеряно больше всего баллов</span>
      </div>
      <div class="grid gap-4 sm:grid-cols-3">${weakCardsMarkup(weakest,readOnly,group)}</div>
    </div>

    ${essayMarkup(essay)}
    ${historyMarkup(student,report,readOnly,group)}
    ${readOnly?authorCardMarkup():""}`;

  if(!readOnly){
    $("#back-btn").onclick=()=>route("screen-list");
    const entryBtn=$("#entry-for-btn");
    if(entryBtn) entryBtn.onclick=()=>{destroyCharts();renderEntry(student.id);showScreen("screen-entry");window.scrollTo({top:0});};
  }
  $("#report-btn").onclick=()=>openReport(student,s,fc,weakest,essay);

  drawStudentChart(student.exams,fc);
  bindTooltips($("#screen-student"));
}

function weakCardsMarkup(weakest,readOnly,group){
  if(!weakest.length) return `<div class="bg-white rounded-2xl shadow-soft p-6 text-sm text-ink-500 sm:col-span-3">Потерянных баллов нет, все задания выполнены на максимум.</div>`;
  return weakest.map(row=>{
    const topic=EGE_TOPICS[row.task]||{title:"Задание "+row.task,review:"Тема не описана."};
    const pc=Math.round(row.rate*100);
    const cls=readOnly?null:classRateForTask(row.task,group);
    const classPc=cls?Math.round(cls.rate*100):null;
    return `
    <div class="bg-white rounded-2xl shadow-soft p-5 flex flex-col">
      <div class="flex items-center gap-3 mb-3">
        <span class="font-mono font-bold text-sm tnum w-9 h-9 rounded-xl bg-brand-50 text-brand-600 grid place-items-center shrink-0">${row.task}</span>
        <span class="font-display font-bold text-[15px] leading-snug">${escHtml(topic.title)}</span>
      </div>
      <div class="text-xs uppercase tracking-wide text-ink-500 mb-2">Что повторить</div>
      <p class="text-[13px] text-ink-700 leading-relaxed mb-4 flex-1">${escHtml(topic.review)}</p>
      <div class="flex items-center justify-between text-xs mb-2">
        <span class="text-ink-500">Успешность</span>
        <span class="font-mono font-bold tnum">${pc}%${classPc!==null?`<span class="text-ink-300 font-normal"> · класс ${classPc}%</span>`:""}</span>
      </div>
      <div class="h-2 rounded-full bg-gray-100 overflow-hidden mb-3"><div class="h-full rounded-full ${barColor(pc)}" style="width:${pc}%"></div></div>
      <div class="text-xs text-ink-500 tnum">Потеряно <span class="font-mono font-bold text-ink-900">${row.lost}</span> из ${row.possible} за ${row.attempts} ${plural(row.attempts,"пробник","пробника","пробников")}</div>
    </div>`;
  }).join("");
}

function essayMarkup(essay){
  if(!essay) return `
    <div class="bg-white rounded-2xl shadow-soft p-5 sm:p-6 mb-6">
      <h2 class="font-display font-bold text-lg mb-2">Сочинение по критериям</h2>
      <p class="text-sm text-ink-500">Баллы по К1–К10 ещё не внесены, поэтому разбора по работам пока нет.</p>
    </div>`;
  const worst=[...essay.rows].filter(r=>r.lost>0).sort((a,b)=>a.rate-b.rate)[0];
  const blockColors={"Содержание":"bg-brand-500","Речевое оформление":"bg-amber-500","Грамотность":"bg-emerald-500"};

  return `
  <div class="bg-white rounded-2xl shadow-soft p-5 sm:p-6 mb-6">

      <h2 class="font-display font-bold text-lg">Сочинение по критериям</h2>
      <span class="text-xs text-ink-500">${essay.count} ${plural(essay.count,"проверенная работа","проверенные работы","проверенных работ")}</span>
    </div>

    <div class="grid gap-4 sm:grid-cols-3 mb-5">
      <div class="bg-paper rounded-xl p-4">
        <div class="text-xs text-ink-500 mb-2">Последняя работа</div>
        <div class="font-mono font-bold text-2xl tnum">${essay.last} <span class="text-ink-300 text-base">/ ${ESSAY_MAX}</span></div>
        <div class="mt-2">${trendMarkup(essay.delta)}</div>
      </div>
      <div class="bg-paper rounded-xl p-4">
        <div class="text-xs text-ink-500 mb-2">Средний за все работы</div>
        <div class="font-mono font-bold text-2xl tnum">${essay.avg}</div>
        <div class="text-xs text-ink-500 mt-2">из ${ESSAY_MAX} возможных</div>
      </div>
      <div class="bg-paper rounded-xl p-4">
        <div class="text-xs text-ink-500 mb-2">Слабее всего</div>
        <div class="font-mono font-bold text-2xl tnum">${worst?worst.key:"—"}</div>
        <div class="text-xs text-ink-500 mt-2 truncate">${worst?escHtml(worst.meta.title)+" · "+Math.round(worst.rate*100)+"%":"все критерии закрыты"}</div>
      </div>
    </div>

    <div class="grid gap-4 sm:grid-cols-3 mb-6">
      ${essay.blocks.map(b=>{
        const pc=Math.round(b.last/b.max*100);
        return `
        <div>
          <div class="flex justify-between items-baseline gap-2 text-xs mb-2">
            <span class="text-ink-700 font-medium">${escHtml(b.block)}</span>
            <span class="font-mono tnum text-ink-500">${b.last} / ${b.max}</span>
          </div>
          <div class="h-2 rounded-full bg-gray-100 overflow-hidden"><div class="h-full rounded-full ${blockColors[b.block]}" style="width:${pc}%"></div></div>
        </div>`;}).join("")}
    </div>

    <div class="text-xs uppercase tracking-wide text-ink-500 mb-3">Каждый критерий по каждому пробнику</div>
    <div class="matrix-wrap rounded-xl border border-gray-100">
      <table class="matrix w-full border-collapse">
        <thead class="sticky top-0 z-20 bg-white">

function drawStudentChart(exams,fc){
  const labels=exams.map(e=>e.label).concat(["к экзамену"]);
  const n=exams.length;
  const actual=exams.map(e=>e.secondary).concat([null]);
  const predicted=exams.map(()=>null); predicted[n-1]=exams[n-1].secondary; predicted.push(fc.baseSecondary);
  const high=exams.map(()=>null); high[n-1]=exams[n-1].secondary; high.push(fc.highSecondary);
  const low=exams.map(()=>null);  low[n-1]=exams[n-1].secondary;  low.push(fc.lowSecondary);

  const passZone={
    id:"passZone",
    beforeDatasetsDraw(chart){
      const {ctx,chartArea,scales:{y}}=chart;
      if(!chartArea) return;
      const yPass=y.getPixelForValue(PASS_SCORE_UNIVERSITY);
      ctx.save();
      ctx.fillStyle="rgba(226,75,74,.05)";
      ctx.fillRect(chartArea.left,yPass,chartArea.right-chartArea.left,chartArea.bottom-yPass);
      ctx.strokeStyle="#F09999";
      ctx.setLineDash([5,5]); ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(chartArea.left,yPass); ctx.lineTo(chartArea.right,yPass); ctx.stroke();
      ctx.setLineDash([]);
      ctx.font="500 10px Inter, sans-serif";
      ctx.fillStyle="#C46A6A";
      ctx.textAlign="left"; ctx.textBaseline="bottom";
      ctx.fillText("порог 36",chartArea.left+6,yPass-4);
      ctx.restore();
    }
  };

  const pointValues={
    id:"pointValues",
    afterDatasetsDraw(chart){
      const {ctx}=chart;
      const meta=chart.getDatasetMeta(1);
      if(!meta) return;
      ctx.save();
      ctx.font="700 11px 'JetBrains Mono', monospace";
      ctx.textAlign="center"; ctx.textBaseline="bottom";
      meta.data.forEach((pt,i)=>{
        if(actual[i]==null) return;
        ctx.fillStyle="#374151";
        ctx.fillText(String(actual[i]),pt.x,pt.y-12);
      });
      const fmeta=chart.getDatasetMeta(3);
      if(fmeta && fmeta.data[n]){
        const pt=fmeta.data[n];
        ctx.fillStyle="#4A46BE";
        ctx.fillText(String(fc.baseSecondary),pt.x,pt.y-12);
      }
      ctx.restore();
    }
  };

  makeChart("score-chart",{
    type:"line",
    data:{labels,datasets:[
      {label:"Верх диапазона",data:high,borderColor:"rgba(91,87,214,.22)",borderWidth:1,pointRadius:0,fill:"+2",backgroundColor:"rgba(91,87,214,.09)",tension:0},
      {label:"Тестовый балл",data:actual,borderColor:"#5B57D6",backgroundColor:"rgba(91,87,214,.10)",borderWidth:3,fill:true,tension:.35,
       pointRadius:5,pointHoverRadius:8,pointBackgroundColor:"#fff",pointBorderColor:"#5B57D6",pointBorderWidth:3,
       pointHoverBackgroundColor:"#5B57D6",pointHoverBorderColor:"#fff",pointHoverBorderWidth:3},
      {label:"Низ диапазона",data:low,borderColor:"rgba(91,87,214,.22)",borderWidth:1,pointRadius:0,fill:false,tension:0},
      {label:"Прогноз",data:predicted,borderColor:"#5B57D6",borderWidth:2,borderDash:[5,5],fill:false,tension:0,
       pointRadius:ctx=>ctx.dataIndex===n?6:0,pointStyle:"rectRot",pointBackgroundColor:"#fff",pointBorderColor:"#5B57D6",pointBorderWidth:3}
    ]},
    options:{
      responsive:true,maintainAspectRatio:false,
      layout:{padding:{top:22,right:8}},
      interaction:{mode:"index",intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:"#111827",padding:12,cornerRadius:12,displayColors:false,
          titleFont:{family:"Manrope",size:12,weight:"700"},bodyFont:{family:"Inter",size:12},
          filter:item=>item.datasetIndex===1||item.datasetIndex===3,
          callbacks:{
            title:i=>{const idx=i[0].dataIndex;return idx<n?"Пробник "+exams[idx].fullLabel:"Прогноз на экзамен";},
            label:item=>{
              const i=item.dataIndex;
              if(item.datasetIndex===1&&i<n){
                const prev=i>0?exams[i-1].secondary:null;
                const delta=prev===null?"":(exams[i].secondary-prev>0?`  ↑ +${exams[i].secondary-prev}`:exams[i].secondary-prev<0?`  ↓ ${exams[i].secondary-prev}`:"  без изменений");
                return `${exams[i].secondary} тестовых · ${exams[i].primary} из ${MAX_PRIMARY} первичных${delta}`;
              }
              if(item.datasetIndex===3&&i===n) return `Диапазон ${fc.lowSecondary}–${fc.highSecondary}, базовый ${fc.baseSecondary}`;
              return null;
            }
          }
        }
      },
      scales:{
        y:{min:0,max:100,border:{display:false},
           ticks:{stepSize:25,padding:8,color:"#9CA3AF",font:{family:"JetBrains Mono",size:11}},
           grid:{color:"#F3F4F6",drawTicks:false}},
        x:{border:{display:false},grid:{display:false},
           ticks:{padding:8,font:ctx=>({family:"Inter",size:11,weight:ctx.index===labels.length-1?"600":"400"}),
                  color:ctx=>ctx.index===labels.length-1?"#4A46BE":"#6B7280"}}
      }
    },
    plugins:[passZone,pointValues]
  });
}

function reportText(student,s,fc,weakest,essay){
  const lines=[
    `Ученик ${student.code} — результаты подготовки к ЕГЭ по русскому языку`,``,
    `Последний пробник ${s.last.fullLabel}: ${s.last.secondary} тестовых баллов (${s.last.primary} из ${MAX_PRIMARY} первичных).`,
    s.deltaSecondary===null?`Это первый пробник в статистике.`:
      s.deltaSecondary>0?`Рост к предыдущему пробнику: +${s.deltaSecondary} балла.`:
      s.deltaSecondary<0?`Снижение к предыдущему пробнику: ${s.deltaSecondary} балла.`:`Результат повторяет предыдущий пробник.`,
    `Средний балл за ${student.exams.length} ${plural(student.exams.length,"пробник","пробника","пробников")}: ${s.avgSecondary}.`,``,
    `Прогноз к экзамену: ${fc.lowSecondary}–${fc.highSecondary} баллов, базовый сценарий ${fc.baseSecondary}. При системной работе над темами ниже — до ${fc.potentialSecondary}.`,``,
    `Что повторить ближайшие недели:`
  ];
  weakest.forEach((r,i)=>{
    const t=EGE_TOPICS[r.task]||{title:"Задание "+r.task,review:""};
    lines.push(`${i+1}. Задание ${r.task} — ${t.title} (успешность ${Math.round(r.rate*100)}%). ${t.review}`);
  });
  if(essay){
    const w=[...essay.rows].filter(r=>r.lost>0).sort((a,b)=>a.rate-b.rate)[0];
    lines.push(``,`Сочинение: последняя работа ${essay.last} из ${ESSAY_MAX}, средний за ${essay.count} ${plural(essay.count,"работу","работы","работ")} — ${essay.avg}.`);
    if(w) lines.push(`Основная потеря — ${w.key} (${w.meta.title}), ${Math.round(w.rate*100)}% от возможного. ${w.meta.review}`);
  }
  lines.push(``,`Порог для подачи документов в вуз — 36 тестовых баллов.`,
    ``,`———`,
    `${AUTHOR.name} · ${AUTHOR.brand}`,
    `${AUTHOR.tagline}`,
    `Telegram: ${AUTHOR.telegram}`,
    `ВКонтакте: ${AUTHOR.vk}`);
  return lines.join("\n");
}

  const inputs=[...$("#screen-entry").querySelectorAll(".js-score")];
  const collect=()=>{
    const results={},essay={};
    inputs.forEach(inp=>{
      const v=toNumber(inp.value);
      if(v===null) return;
      if(inp.dataset.task) results[inp.dataset.task]=Math.max(0,Math.min(+inp.max,v));
      else essay[inp.dataset.criterion]=Math.max(0,Math.min(+inp.max,v));
    });
    const essayTotal=Object.values(essay).reduce((a,b)=>a+b,0);
    return {results,essay,essayTotal,primary:Object.values(results).reduce((a,b)=>a+b,0)+essayTotal};
  };
  const refresh=()=>{
    const d=collect();
    $("#entry-primary").textContent=d.primary;
    $("#entry-secondary").textContent=toSecondary(d.primary);

  inputs.forEach((inp,i)=>{
    inp.addEventListener("input",()=>{
      const max=+inp.max, v=toNumber(inp.value);
      if(v!==null&&v>max) inp.value=max;
      refresh();
      if(inp.value!==""&&String(inp.value).length>=String(max).length&&inputs[i+1]) inputs[i+1].focus();
    });
    inp.addEventListener("keydown",e=>{
      if(e.key==="Enter"){e.preventDefault();(inputs[i+1]||$("#entry-save")).focus();}
      if(e.key==="ArrowRight"&&inputs[i+1]) inputs[i+1].focus();
      if(e.key==="ArrowLeft"&&inputs[i-1]) inputs[i-1].focus();
    });
  });

  $("#entry-clear").onclick=()=>{inputs.forEach(i=>i.value="");refresh();$("#entry-msg").textContent="";};

  const toImport=$("#to-import");
  if(toImport) toImport.onclick=()=>route("screen-import");

  if(canEdit) $("#entry-save").onclick=async e=>{
    const btn=e.currentTarget, msg=$("#entry-msg");
    const studentId=$("#entry-student").value, date=$("#entry-date").value;
    if(!studentId){ msg.innerHTML=`<span class="text-rose-600">Выберите код ученика</span>`; return; }
    if(!date){ msg.innerHTML=`<span class="text-rose-600">Укажите дату пробника</span>`; return; }
    const d=collect();
    if(!Object.keys(d.results).length&&!Object.keys(d.essay).length){
      msg.innerHTML=`<span class="text-rose-600">Заполните хотя бы одно задание</span>`; return;
    }
    btn.textContent="Сохраняем…";
    try{
      await api.saveExam(studentId,date,d.results,d.essay);
      await reloadData();
      const st=state.students.find(x=>x.id===studentId);
      const ex=st?st.exams.find(x=>x.key===date):null;
      msg.innerHTML=ex
        ? `<span class="text-emerald-600">Сохранено — ${escHtml(st.code)}, ${escHtml(ex.fullLabel)}, ${ex.primary} первичных и ${ex.secondary} тестовых.</span>`
        : `<span class="text-emerald-600">Сохранено.</span>`;
      inputs.forEach(i=>i.value=""); refresh();
    }catch(err){ msg.innerHTML=`<span class="text-rose-600">${escHtml(err.message)}</span>`; }
    btn.textContent="Сохранить пробник";
  };

  refresh();
}

/* =========================================================================
   20. ИМПОРТ ИЗ ТАБЛИЦЫ
   Файл разбирается в браузере, результат сохраняется в облако.
   ========================================================================= */
const IMPORT_TASKS = KNOWN_TASKS.filter(t=>t!==27);

function csvTemplate(){
  const header=["код","класс","дата",...IMPORT_TASKS.map(String),...CRITERIA_KEYS];
  const maxRow=["#максимум по столбцу","","",
    ...IMPORT_TASKS.map(t=>String(maxScoreFor(t))),
    ...CRITERIA_KEYS.map(k=>String(ESSAY_CRITERIA[k].max))];
  const lines=[
    header.join(";"),
    "#Строки со знаком решётки в начале при загрузке пропускаются",
    maxRow.join(";"),
    "#Ниже вносите свои данные: одна строка — один пробник одного ученика",
    "#Столбец «класс» необязателен: если оставить пустым, ученик попадёт в «Без класса»",
    "#Пустая ячейка задания означает, что оно не проверялось, ноль — что получен ноль баллов"
  ];
  return "\uFEFF"+lines.join("\r\n")+"\r\n";
}

function splitCsvLine(line,delim){
  const out=[]; let cur="", inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){
      if(inQ && line[i+1]==='"'){ cur+='"'; i++; }
      else inQ=!inQ;
    } else if(ch===delim && !inQ){ out.push(cur); cur=""; }
    else cur+=ch;
  }
  out.push(cur);
  return out.map(s=>s.trim());
}
function detectDelimiter(firstLine){
  const counts=[[";",(firstLine.match(/;/g)||[]).length],
                ["\t",(firstLine.match(/\t/g)||[]).length],
                [",",(firstLine.match(/,/g)||[]).length]];
  counts.sort((a,b)=>b[1]-a[1]);
  return counts[0][1]>0?counts[0][0]:";";
}

// Кодировка определяется автоматически: UTF-8 или Windows-1251
function decodeBytes(buffer){
  const bytes=new Uint8Array(buffer);
  if(bytes[0]===0xEF&&bytes[1]===0xBB&&bytes[2]===0xBF) return new TextDecoder("utf-8").decode(bytes);
  try{ return new TextDecoder("utf-8",{fatal:true}).decode(bytes); }
  catch(e){
    try{ return new TextDecoder("windows-1251").decode(bytes); }
    catch(_){ return new TextDecoder("utf-8").decode(bytes); }
  }
}

function parseImportText(text){
  const clean=text.replace(/^\uFEFF/,"").replace(/\r\n?/g,"\n");
  const lines=clean.split("\n").filter(l=>l.trim()!=="");
  if(lines.length<2) return {error:"В файле нет ни одной строки с данными."};

  const delim=detectDelimiter(lines[0]);
  const header=splitCsvLine(lines[0],delim).map(h=>h.replace(/^"|"$/g,"").trim());
  const shown=header.slice(0,8).join(" | ");

  const map={code:-1,date:-1,group:-1,tasks:{},criteria:{}};
  header.forEach((h,i)=>{
    const low=h.toLowerCase();
    if(map.code<0 && /^(код|code|ученик|id)/.test(low)){ map.code=i; return; }
    if(map.date<0 && /^(дата|date)/.test(low)){ map.date=i; return; }
    if(map.group<0 && /^(класс|группа|group|class)/.test(low)){ map.group=i; return; }
    const crit=h.match(/^[КKкk]\s*(\d{1,2})$/);
    if(crit){
      const key="К"+parseInt(crit[1],10);
      if(ESSAY_CRITERIA[key]) map.criteria[key]=i;
      return;
    }
    const num=low.match(/\d+/);
    if(num && /^(\d+|задание|task|з)/.test(low)){
      const n=parseInt(num[0],10);
      if(n>=1&&n<=26) map.tasks[n]=i;
    }
  });

  if(map.code<0) return {error:"Не найден столбец с кодом ученика. Первый столбец должен называться «код».",headers:shown};
  if(map.date<0) return {error:"Не найден столбец с датой пробника. Второй столбец должен называться «дата».",headers:shown};
  if(!Object.keys(map.tasks).length && !Object.keys(map.criteria).length)
    return {error:"Не найдено ни одного столбца с заданиями или критериями.",headers:shown};

  const existing=new Map(state.students.map(s=>[s.code.toLowerCase(),s]));
  const seen=new Set();
  const rows=[];

  lines.slice(1).forEach((line,idx)=>{
    const cells=splitCsvLine(line,delim).map(c=>c.replace(/^"|"$/g,"").trim());
    const code=(cells[map.code]||"").trim();
    if(!code || code.startsWith("#")) return;

    const row={line:idx+2,code,issues:[],results:{},essay:{},isNew:false,group:""};

    const codeErr=validateCode(code);
    if(codeErr) row.issues.push(`код — ${codeErr}`);

    if(map.group>=0){
      const gr=(cells[map.group]||"").trim();
      const grErr=validateGroup(gr);
      if(grErr) row.issues.push(grErr); else row.group=gr;
    }

    const d=parseDate(cells[map.date]);
    if(!d) row.issues.push("дата не распознана");
    else row.date=isoDate(d);

    Object.entries(map.tasks).forEach(([task,col])=>{
      const v=toNumber(cells[col]);
      if(v===null) return;
      const max=maxScoreFor(+task);
      if(v<0||v>max){ row.issues.push(`задание ${task} — балл вне диапазона 0…${max}`); return; }
      row.results[task]=v;
    });
    Object.entries(map.criteria).forEach(([key,col])=>{
      const v=toNumber(cells[col]);
      if(v===null) return;
      const max=ESSAY_CRITERIA[key].max;
      if(v<0||v>max){ row.issues.push(`${key} — балл вне диапазона 0…${max}`); return; }
      row.essay[key]=v;
    });

    if(!Object.keys(row.results).length && !Object.keys(row.essay).length)
      row.issues.push("нет ни одного балла");

    const dupKey=code.toLowerCase()+"|"+(row.date||"");
    if(seen.has(dupKey)) row.issues.push("строка дублирует предыдущую по коду и дате");
    seen.add(dupKey);

    const student=existing.get(code.toLowerCase());
    row.isNew=!student;
    row.studentId=student?student.id:null;
    row.groupLabel=student?groupTitle(student.group):groupTitle(row.group);
    row.overwrite=Boolean(student && row.date && student.exams.some(e=>e.key===row.date));

    const essayTotal=Object.values(row.essay).reduce((a,b)=>a+b,0);
    row.primary=Object.values(row.results).reduce((a,b)=>a+b,0)+essayTotal;
    row.secondary=toSecondary(row.primary);
    rows.push(row);
  });

  if(!rows.length) return {error:"В файле нет заполненных строк. Похоже, загружен пустой шаблон — внесите баллы под строками с решёткой.",headers:shown};
  return {rows,hasGroup:map.group>=0,columns:{tasks:Object.keys(map.tasks).length,criteria:Object.keys(map.criteria).length}};
}

function readImportFile(file){
  const box=$("#import-result");
  const reader=new FileReader();
  reader.onerror=()=>{ box.innerHTML=`<div class="bg-white rounded-2xl shadow-soft p-5 text-sm text-rose-600">Файл не прочитался. Попробуйте пересохранить его как CSV.</div>`; };
  reader.onload=()=>{
    let text="";
    try{ text=decodeBytes(reader.result); }catch(e){ text=""; }
    const parsed=parseImportText(text);
    if(parsed.error){
      box.innerHTML=`<div class="bg-white rounded-2xl shadow-soft p-5">
        <div class="text-sm text-rose-600 mb-2">${escHtml(parsed.error)}</div>
        ${parsed.headers?`<div class="text-xs text-ink-500 mb-2">Что приложение увидело в первой строке: <span class="font-mono">${escHtml(parsed.headers)}</span></div>`:""}
        <div class="text-xs text-ink-500">Скачайте шаблон заново и перенесите данные в него, так столбцы точно совпадут.</div></div>`;
      return;
    }
    renderImportPreview(parsed,file.name);
  };
  reader.readAsArrayBuffer(file);
}

      <div class="matrix-wrap max-h-96">

            ${rows.map(r=>{
              const err=r.issues.length>0;

        </table>
      </div>

      <div class="p-5 sm:p-6 border-t border-gray-100">
        ${overLimit?`<div class="bg-amber-50 text-amber-800 rounded-xl p-3 text-sm mb-4">
          В файле ${newCodes.length} новых ${plural(newCodes.length,"код","кода","кодов")}, а на тарифе «${escHtml(state.plan.name)}» свободно ${free}. Удалите лишние строки или перейдите на тариф выше.</div>`:""}
        ${bad.length?`<p class="text-xs text-ink-500 mb-4">Строки с ошибками будут пропущены, остальные импортируются.</p>`:""}
        <div class="flex flex-wrap items-center gap-3">
          <button id="do-import" class="px-5 py-2.5 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-sm font-semibold transition disabled:opacity-40" ${(!good.length||overLimit)?"disabled":""}>Импортировать ${good.length} ${plural(good.length,"строку","строки","строк")}</button>
          <button id="cancel-import" class="px-4 py-2.5 rounded-xl text-ink-500 hover:text-ink-900 text-sm font-semibold transition">Отменить</button>
          <span id="import-msg" class="text-xs"></span>
        </div>
      </div>
    </div>`;

  $("#cancel-import").onclick=()=>{ $("#import-result").innerHTML=""; $("#file-input").value=""; };

  if(good.length && !overLimit) $("#do-import").onclick=async e=>{
    const btn=e.currentTarget, msg=$("#import-msg");
    btn.disabled=true;
    msg.className="text-xs text-ink-500";
    let saved=0, failed=0;

    try{
      if(newEntries.length){
        msg.textContent="Создаём коды…";
        await api.addStudents(newEntries);
        await reloadData();
      }
      const byCode=new Map(state.students.map(s=>[s.code.toLowerCase(),s.id]));

      for(let i=0;i<good.length;i++){
        const r=good[i];
        const id=byCode.get(r.code.toLowerCase());
        msg.textContent=`Сохраняем ${i+1} из ${good.length}…`;
        if(!id){ failed++; continue; }
        try{ await api.saveExam(id,r.date,r.results,r.essay); saved++; }
        catch(err){ failed++; }
      }

      await reloadData();
      msg.className="text-xs "+(failed?"text-amber-600":"text-emerald-600");
      msg.textContent=failed
        ? `Импортировано ${saved}, не сохранилось ${failed}.`
        : `Импортировано ${saved} ${plural(saved,"пробник","пробника","пробников")}.`;
      btn.textContent="Готово";
      setTimeout(()=>route("screen-list"),1600);
    }catch(err){
      msg.className="text-xs text-rose-600";
      msg.textContent=/limit|лимит/i.test(err.message)?"Достигнут лимит тарифа":err.message;
      btn.disabled=false;
    }
  };
}

/* =========================================================================
   21. ГЛОБАЛЬНЫЙ ТУЛТИП
   ========================================================================= */
const tooltipEl=document.getElementById("global-tooltip");
const TOOLTIP_GAP=14;
function showTooltip(event){
  const el=event.currentTarget;
  const title=el.dataset.title, rule=el.dataset.rule, label=el.dataset.label||"";
  if(!title&&!rule) return;
  tooltipEl.innerHTML=
    (label?`<span class="tt-num">${escHtml(label)}</span>`:"")+
    (title?`<div class="tt-title">${escHtml(title)}</div>`:"")+
    (rule?`<div class="tt-rule">${escHtml(rule)}</div>`:"");
  tooltipEl.classList.add("is-visible");
  tooltipEl.setAttribute("aria-hidden","false");
  positionTooltip(el);
}
function positionTooltip(el){
  const a=el.getBoundingClientRect(), t=tooltipEl.getBoundingClientRect();
  let left=a.right+TOOLTIP_GAP, top=a.top+a.height/2-t.height/2;
  if(left+t.width>window.innerWidth-8) left=a.left-t.width-TOOLTIP_GAP;
  if(left<8) left=8;
  top=Math.max(8,Math.min(top,window.innerHeight-t.height-8));
  tooltipEl.style.left=Math.round(left)+"px";
  tooltipEl.style.top=Math.round(top)+"px";
}
function hideTooltip(){
  tooltipEl.classList.remove("is-visible");
  tooltipEl.setAttribute("aria-hidden","true");
}
function bindTooltips(root){
  root.querySelectorAll("[data-rule]").forEach(el=>{
    el.addEventListener("mouseenter",showTooltip);
    el.addEventListener("mouseleave",hideTooltip);
    el.addEventListener("focus",showTooltip);
    el.addEventListener("blur",hideTooltip);
  });
}
window.addEventListener("scroll",hideTooltip,true);
window.addEventListener("resize",hideTooltip);
document.addEventListener("keydown",e=>{if(e.key==="Escape")hideTooltip();});

/* =========================================================================
   22. ДЕМО-ДАННЫЕ ДЛЯ РЕЖИМА БЕЗ БАЗЫ
   ========================================================================= */
const DEMO_STUDENTS=(function(){
  const dates=["2025-09-20","2025-10-18","2025-11-22","2025-12-20","2026-01-24","2026-02-21"];
  const tasks=KNOWN_TASKS.filter(t=>t!==27);
  let seed=20260214;
  const rnd=()=>{seed=(seed*1103515245+12345)%2147483648;return seed/2147483648;};
  const weak=[4,8,12,15,21], weakCriteria=["К2","К8"];
  return [{
    code:"11А-07", group:"11А",
    exams:dates.map((date,ei)=>{
      const level=Math.max(.2,Math.min(.96,.62+.018*ei+(rnd()-.5)*.09));
      const results={};
      tasks.forEach(t=>{
        if(rnd()<.02&&ei>0) return;
        const chance=weak.includes(t)?level*.45:level;
        const max=maxScoreFor(t);
        results[t]=max===1?(rnd()<chance?1:0):(rnd()<chance?2:(rnd()<.5?1:0));
      });
      const essay={};
      CRITERIA_KEYS.forEach(k=>{
        const max=ESSAY_CRITERIA[k].max;
        const chance=weakCriteria.includes(k)?level*.45:level;
        essay[k]=Math.max(0,Math.min(max,Math.round(max*chance+(rnd()-.5)*.9)));
      });
      return {date,results,essay};
    })
  }];
})();
